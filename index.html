<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido Manases</title>
    <!-- Tailwind CSS CDN para un estilo moderno y elegante -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <!-- Fuente Inter desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Tarjeta Principal con efecto Glassmorphism -->
    <main class="w-full max-w-lg p-8 md:p-12 bg-slate-900/60 backdrop-blur-xl border border-slate-700/50 rounded-3xl shadow-2xl shadow-indigo-950/50 text-center flex flex-col items-center justify-center transition-all duration-300 hover:border-slate-600/60">
        
        <!-- Elemento Decorativo Luminoso -->
        <div class="w-16 h-16 mb-6 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 animate-pulse-slow">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457-.39-2.823-1.07-4">
                </path>
            </svg>
        </div>

        <!-- Título Principal -->
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-200 via-sky-300 to-purple-300 mb-8 leading-tight">
            BIENVENIDO MANASES
        </h1>

        <!-- Contenedor del Botón Vacío -->
        <div class="w-full max-w-xs flex flex-col items-center gap-3">
            <!-- Botón Vacío (sin texto en su interior) -->
            <button 
                type="button" 
                aria-label="Botón vacío"
                class="w-full h-14 bg-indigo-600/20 hover:bg-indigo-600/30 active:bg-indigo-600/40 text-transparent border border-indigo-500/50 hover:border-indigo-400 rounded-xl transition-all duration-200 shadow-md hover:shadow-indigo-500/20 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-slate-900 cursor-pointer">
            </button>
            <span class="text-xs text-slate-400 font-medium tracking-wide uppercase">( Botón Vacío )</span>
        </div>

    </main>

</body>
</html>
